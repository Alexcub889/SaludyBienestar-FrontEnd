<body>
    <div class="container-fluid bg-light" style="width: 1000px; border-radius: 20px; padding: 50px">
        <img src="../img/leaf-hand-drawn_78370-6460.avif" style="max-width: 150px;max-height: 150px; border-radius: 50%;"> <br>
        <h1>Progreso semanal</h1>
            <form class="mb-3" id="form_progreso">
                <input class="form-control" id="peso" type="number" placeholder="Peso" required></input>
                <input class="form-control" id="horas_sueno" type="number" placeholder="Horas de sueño" required></input>
                <label>Actividad realizada</label>
                <select placeholder="Ejercicio realizado" name="actividad_realizada" class="form-select" id="actividad_realizada">
                    <option value="planchas">planchas</option>
                    <option value="caminatas">caminatas</option>
                    <option value="meditacion">meditacion</option>
                    <option value="natacion">natacion</option>
                    <option value="cardio">cardio</option>
                </select><br>
                <br>
                <button class="btn btn-secondary bg-dark text-white" type="submit">Registrar</button>
            </form>
            <br>
            <div style="background-color:rgb(189, 186, 186);">
                <table class="table table-bordered">
                    <thead>
                        <tr>
                            <th>Peso</th>
                            <th>Horas de sueño semanal</th>
                            <th>Actividades realizadas</th>
                            <th>fecha</th>
                        </tr>
                    </thead>
                    <tbody id="tablaprogreso">
                        <tr><td colspan="4">Sin datos</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
        <script src="../js/config.js"></script>
        <script src="../js/progreso.js"></script>
</body>
